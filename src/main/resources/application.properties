spring.application.name=GenMan
server.port=8080

# mysql
spring.datasource.url=jdbc:mysql://localhost:3306/ManGen?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
spring.web.cors.allowed-origins=http://localhost:8501   # puerto por defecto de Flet
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*