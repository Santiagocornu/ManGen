spring.application.name=GenMan
spring.config.import=optional:file:.env[.properties]
server.port=8080
spring.main.banner-mode=off

# mysql
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.orm=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR
logging.level.org.springframework.data.jpa=ERROR
logging.level.root=ERROR
logging.level.com.GenMan.GenMan.Exceptions.GlobalExceptionHandler=WARN
logging.level.com.GenMan.GenMan.Security.JwtFilter=WARN
logging.level.com.GenMan.GenMan.Security.SecurityConfig=WARN
logging.level.com.GenMan.GenMan.Security.RequestLoggingFilter=INFO

# CORS
spring.web.cors.allowed-origins=http://localhost:8501
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*

# app secret
Key=${APP_SECRET:${key}}
